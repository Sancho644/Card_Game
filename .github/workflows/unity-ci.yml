name: Unity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-tests:
    name: Unity Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: Library
          key: unity-${{ runner.os }}-editmode-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-${{ hashFiles('Assets/**', 'ProjectSettings/**') }}
          restore-keys: unity-${{ runner.os }}-editmode-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-
      - name: Compile and run all EditMode tests
        uses: ./.github/actions/unity-editmode
        with:
          results-path: Logs/CI/EditMode
          results-artifact: unity-editmode-results
          memory-artifact: unity-tests-memory-diagnostics
          unity-license: ${{ secrets.UNITY_LICENSE }}
          unity-serial: ${{ secrets.UNITY_SERIAL }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}

  card-validation:
    name: Card Database Validation
    needs: unity-tests
    # A failed full run can include a validation failure. Still publish its separate report.
    if: ${{ !cancelled() && (needs.unity-tests.result == 'success' || needs.unity-tests.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6
        with:
          path: Library
          key: unity-${{ runner.os }}-editmode-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-${{ hashFiles('Assets/**', 'ProjectSettings/**') }}
          restore-keys: unity-${{ runner.os }}-editmode-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-
      - name: Validate card data and decks
        uses: ./.github/actions/unity-editmode
        with:
          results-path: Logs/CI/CardValidation
          results-artifact: unity-card-validation
          memory-artifact: unity-card-validation-memory-diagnostics
          validation: 'true'
          unity-license: ${{ secrets.UNITY_LICENSE }}
          unity-serial: ${{ secrets.UNITY_SERIAL }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}

  windows-build:
    name: Windows Build
    needs: [unity-tests, card-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: Library
          key: unity-${{ runner.os }}-windows64-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-${{ hashFiles('Assets/**', 'ProjectSettings/**') }}
          restore-keys: unity-${{ runner.os }}-windows64-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-
      - name: Prepare GameCI image with Editor log capture
        id: prepare
        run: |
          unity_version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          test -n "$unity_version"
          docker build --file .github/ci/WindowsBuilder.Dockerfile \
            --build-arg "UNITY_VERSION=${unity_version}" \
            --tag cardgame-windows-builder:ci .github/ci
          mkdir -p Logs/CI/Windows
          date --iso-8601=ns > Logs/CI/Windows/runner-resources.log
          free -m >> Logs/CI/Windows/runner-resources.log
          printf 'started=%s\n' "$(date --iso-8601=ns)" >> "$GITHUB_OUTPUT"
      - name: Build Windows x64 player
        id: build
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildName: CardGame
          buildsPath: Builds/CI
          versioning: None
          customImage: cardgame-windows-builder:ci
          customParameters: -job-worker-count 2 -refreshImportMode InProcess
      - name: Collect Windows container events
        if: always() && steps.prepare.outcome == 'success'
        env:
          STARTED: ${{ steps.prepare.outputs.started }}
        run: |
          {
            date --iso-8601=ns
            free -m
            if ! docker events --since "$STARTED" --until "$(date --iso-8601=ns)" \
              --filter type=container --filter image=cardgame-windows-builder:ci \
              --format '{{.TimeNano}} {{.Action}} {{.Actor.ID}} exit={{index .Actor.Attributes "exitCode"}} signal={{index .Actor.Attributes "signal"}}'; then
              echo 'Docker event history unavailable. See the in-container resource log if present.'
            fi
          } >> Logs/CI/Windows/runner-resources.log
      - name: Verify player files
        run: |
          player=Builds/CI/StandaloneWindows64
          data="$player/CardGame_Data"
          test -s "$player/CardGame.exe"
          test -s "$player/UnityPlayer.dll"
          test -s "$data/globalgamemanagers"
          test -s "$data/Managed/Game.Presentation.dll"
          scene_count=$(grep -cE '^[[:space:]]*- enabled: 1[[:space:]]*$' ProjectSettings/EditorBuildSettings.asset)
          for ((i = 0; i < scene_count; i++)); do
            test -s "$data/level$i"
          done
          test -s "$data/sharedassets0.assets.resS"
          test -s "$data/sharedassets1.assets"
          test -s "$data/sharedassets2.assets"
          printf 'Verified %s scene files, player assemblies and shared assets.\n' "$scene_count"
      - name: Upload Windows x64 player
        uses: actions/upload-artifact@v7
        with:
          name: CardGame-Windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            Builds/CI/StandaloneWindows64/
            !Builds/CI/StandaloneWindows64/**/*DontShip*/**
            !Builds/CI/StandaloneWindows64/**/*.pdb
          if-no-files-found: error
          retention-days: 14
      - name: Check whether Unity wrote the build log
        id: build-log
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          if [[ -s Logs/CI/Windows/Editor.log ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [[ "$BUILD_OUTCOME" == success ]]; then
            echo '::error::Unity reported success but its Editor.log is missing or empty.'
            exit 1
          elif [[ "$BUILD_OUTCOME" == failure ]]; then
            echo '::notice::No Editor.log was produced. Check the GameCI output for startup or activation errors.'
          fi
      - name: Upload Windows build log
        if: always() && steps.build-log.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unity-windows-build-log
          path: Logs/CI/Windows/Editor.log
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows resource diagnostics
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: unity-windows-build-resources-${{ github.run_attempt }}
          path: Logs/CI/Windows/*resources.log
          if-no-files-found: error
          retention-days: 14
